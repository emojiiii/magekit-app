name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      bump:
        description: "Auto bump version when version is empty (major/minor/patch)"
        required: false
        default: patch
        type: choice
        options:
          - patch
          - minor
          - major
      version:
        description: "Release version (e.g., v0.1.0). Leave empty to auto-bump."
        required: false
        type: string

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  APP_NAME: MageKit

jobs:
  # Prepare release version
  prepare:
    name: Prepare Release
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Get version
        id: version
        run: |
          set -euo pipefail

          if [ "${{ github.event_name }}" != "workflow_dispatch" ]; then
            echo "version=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          input_version="${{ inputs.version }}"
          bump="${{ inputs.bump }}"

          if [ -n "${input_version}" ]; then
            version="${input_version}"
            case "${version}" in
              v*) ;;
              *) version="v${version}" ;;
            esac
          else
            latest_tag="$(git tag -l 'v[0-9]*' --sort=-version:refname | head -n 1 || true)"
            if [ -z "${latest_tag}" ]; then
              version="v0.1.0"
            else
              if [[ "${latest_tag}" =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+) ]]; then
                major="${BASH_REMATCH[1]}"
                minor="${BASH_REMATCH[2]}"
                patch="${BASH_REMATCH[3]}"
              else
                echo "Invalid latest tag format: ${latest_tag}" >&2
                exit 1
              fi

              case "${bump}" in
                major)
                  major=$((major + 1))
                  minor=0
                  patch=0
                  ;;
                minor)
                  minor=$((minor + 1))
                  patch=0
                  ;;
                patch|*)
                  patch=$((patch + 1))
                  ;;
              esac

              version="v${major}.${minor}.${patch}"
            fi
          fi

          if [[ ! "${version}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([\-+][0-9A-Za-z.\-]+)?$ ]]; then
            echo "Invalid version: ${version}" >&2
            exit 1
          fi

          echo "version=${version}" >> "$GITHUB_OUTPUT"

  # macOS build
  build-macos:
    name: Build macOS
    runs-on: macos-latest
    needs: prepare
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-apple-darwin, aarch64-apple-darwin

      - name: Cache cargo
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: macos-release-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            macos-release-cargo-

      - name: Build for x86_64
        run: cargo build --release --target x86_64-apple-darwin

      - name: Build for aarch64 (Apple Silicon)
        run: cargo build --release --target aarch64-apple-darwin

      - name: Create Universal Binary
        run: |
          mkdir -p target/universal-apple-darwin/release
          lipo -create \
            target/x86_64-apple-darwin/release/magekit \
            target/aarch64-apple-darwin/release/magekit \
            -output target/universal-apple-darwin/release/magekit
          chmod +x target/universal-apple-darwin/release/magekit

      - name: Create .app bundle
        run: |
          APP_DIR="MageKit.app"
          mkdir -p "${APP_DIR}/Contents/MacOS"
          mkdir -p "${APP_DIR}/Contents/Resources"
          
          cp target/universal-apple-darwin/release/magekit "${APP_DIR}/Contents/MacOS/MageKit"
          chmod +x "${APP_DIR}/Contents/MacOS/MageKit"
          
          if [ -d "themes" ]; then
            mkdir -p "${APP_DIR}/Contents/Resources/themes"
            cp -r themes/* "${APP_DIR}/Contents/Resources/themes/"
          fi
          
          if [ -f "assets/icon.icns" ]; then
            cp assets/icon.icns "${APP_DIR}/Contents/Resources/AppIcon.icns"
          fi
          
          cat > "${APP_DIR}/Contents/Info.plist" << 'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleExecutable</key>
              <string>MageKit</string>
              <key>CFBundleIconFile</key>
              <string>AppIcon</string>
              <key>CFBundleIdentifier</key>
              <string>com.emojiiii.magekit</string>
              <key>CFBundleName</key>
              <string>MageKit</string>
              <key>CFBundleDisplayName</key>
              <string>MageKit</string>
              <key>CFBundlePackageType</key>
              <string>APPL</string>
              <key>CFBundleShortVersionString</key>
              <string>${{ needs.prepare.outputs.version }}</string>
              <key>CFBundleVersion</key>
              <string>${{ needs.prepare.outputs.version }}</string>
              <key>LSMinimumSystemVersion</key>
              <string>11.0</string>
              <key>NSHighResolutionCapable</key>
              <true/>
              <key>NSSupportsAutomaticGraphicsSwitching</key>
              <true/>
          </dict>
          </plist>
          EOF

      - name: Create DMG
        run: |
          mkdir -p dmg_contents
          cp -r MageKit.app dmg_contents/
          ln -s /Applications dmg_contents/Applications
          
          hdiutil create -volname "MageKit" \
            -srcfolder dmg_contents \
            -ov -format UDZO \
            "MageKit-${{ needs.prepare.outputs.version }}-macos-universal.dmg"

      - name: Upload macOS DMG
        uses: actions/upload-artifact@v5
        with:
          name: macos-dmg
          path: MageKit-${{ needs.prepare.outputs.version }}-macos-universal.dmg

      - name: Upload macOS App (zip)
        run: |
          zip -r "MageKit-${{ needs.prepare.outputs.version }}-macos-universal.app.zip" MageKit.app

      - name: Upload macOS App zip
        uses: actions/upload-artifact@v5
        with:
          name: macos-app-zip
          path: MageKit-${{ needs.prepare.outputs.version }}-macos-universal.app.zip

  # Windows build
  build-windows:
    name: Build Windows
    runs-on: windows-latest
    needs: prepare
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: windows-release-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            windows-release-cargo-

      - name: Build release
        run: cargo build --release

      - name: Prepare release files
        shell: pwsh
        run: |
          $version = "${{ needs.prepare.outputs.version }}"
          $releaseDir = "release-windows"
          
          New-Item -ItemType Directory -Force -Path $releaseDir
          
          Copy-Item "target\release\magekit.exe" "$releaseDir\MageKit.exe"
          
          if (Test-Path "themes") {
            Copy-Item -Recurse "themes" "$releaseDir\themes"
          }
          
          New-Item -ItemType File -Path "$releaseDir\portable.txt" -Value "MageKit Portable Edition"
          
          Compress-Archive -Path "$releaseDir\*" -DestinationPath "MageKit-$version-windows-x64-portable.zip"
          
          Copy-Item "target\release\magekit.exe" "MageKit-$version-windows-x64.exe"

      - name: Upload Windows portable zip
        uses: actions/upload-artifact@v5
        with:
          name: windows-portable-zip
          path: MageKit-${{ needs.prepare.outputs.version }}-windows-x64-portable.zip

      - name: Upload Windows exe
        uses: actions/upload-artifact@v5
        with:
          name: windows-exe
          path: MageKit-${{ needs.prepare.outputs.version }}-windows-x64.exe

  # Linux build
  build-linux:
    name: Build Linux
    runs-on: ubuntu-22.04
    needs: prepare
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: linux-release-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            linux-release-cargo-

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            pkg-config \
            libssl-dev \
            libxcb1-dev \
            libxcb-render0-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev \
            libxkbcommon-dev \
            libxkbcommon-x11-dev \
            libwayland-dev \
            libvulkan-dev \
            vulkan-tools \
            libegl1-mesa-dev \
            libgles2-mesa-dev \
            libx11-dev \
            libxi-dev \
            libxtst-dev \
            libxrandr-dev \
            libxcursor-dev \
            libxcomposite-dev \
            libxdamage-dev \
            libxfixes-dev \
            libxss-dev \
            libdbus-1-dev \
            libasound2-dev \
            libpulse-dev \
            libatk1.0-dev \
            libgtk-3-dev \
            libgdk-pixbuf2.0-dev \
            libpango1.0-dev \
            libcairo2-dev \
            libfontconfig1-dev \
            libfreetype6-dev \
            fuse \
            libfuse2

      - name: Build release
        run: cargo build --release

      - name: Download AppImage tools
        run: |
          wget -q "https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage" -O appimagetool
          chmod +x appimagetool

      - name: Create AppDir structure
        run: |
          VERSION="${{ needs.prepare.outputs.version }}"
          
          mkdir -p AppDir/usr/bin
          mkdir -p AppDir/usr/share/applications
          mkdir -p AppDir/usr/share/icons/hicolor/256x256/apps
          mkdir -p AppDir/usr/share/magekit
          
          cp target/release/magekit AppDir/usr/bin/magekit
          chmod +x AppDir/usr/bin/magekit
          
          if [ -d "themes" ]; then
            cp -r themes AppDir/usr/share/magekit/
          fi
          
          cat > AppDir/magekit.desktop << EOF
          [Desktop Entry]
          Name=MageKit
          Comment=Video Downloader
          Exec=magekit
          Icon=magekit
          Type=Application
          Categories=AudioVideo;Video;Network;
          Terminal=false
          StartupWMClass=MageKit
          EOF
          
          cp AppDir/magekit.desktop AppDir/usr/share/applications/
          
          if [ -f "assets/icon.png" ]; then
            cp assets/icon.png AppDir/usr/share/icons/hicolor/256x256/apps/magekit.png
          else
            convert -size 256x256 xc:'#4A90D9' \
              -gravity center -pointsize 72 -fill white \
              -annotate 0 "MK" \
              AppDir/usr/share/icons/hicolor/256x256/apps/magekit.png 2>/dev/null || \
            echo "Warning: Could not create placeholder icon"
          fi
          
          ln -sf usr/share/icons/hicolor/256x256/apps/magekit.png AppDir/magekit.png 2>/dev/null || true
          ln -sf usr/share/applications/magekit.desktop AppDir/magekit.desktop
          
          cat > AppDir/AppRun << 'APPRUN'
          #!/bin/bash
          HERE="$(dirname "$(readlink -f "${0}")")"
          export PATH="${HERE}/usr/bin:${PATH}"
          export XDG_DATA_DIRS="${HERE}/usr/share:${XDG_DATA_DIRS:-/usr/local/share:/usr/share}"
          exec "${HERE}/usr/bin/magekit" "$@"
          APPRUN
          chmod +x AppDir/AppRun

      - name: Build AppImage
        run: |
          VERSION="${{ needs.prepare.outputs.version }}"
          ARCH=x86_64 ./appimagetool --no-appstream AppDir "MageKit-${VERSION}-linux-x64.AppImage" || {
            echo "AppImage creation failed, creating tar.gz instead"
            tar -czvf "MageKit-${VERSION}-linux-x64.tar.gz" -C AppDir/usr/bin magekit
          }

      - name: Create tar.gz archive
        run: |
          VERSION="${{ needs.prepare.outputs.version }}"
          mkdir -p release-linux
          cp target/release/magekit release-linux/
          if [ -d "themes" ]; then
            cp -r themes release-linux/
          fi
          tar -czvf "MageKit-${VERSION}-linux-x64.tar.gz" -C release-linux .

      - name: Upload Linux AppImage
        uses: actions/upload-artifact@v5
        with:
          name: linux-appimage
          path: MageKit-${{ needs.prepare.outputs.version }}-linux-x64.AppImage
          if-no-files-found: ignore

      - name: Upload Linux tar.gz
        uses: actions/upload-artifact@v5
        with:
          name: linux-tar-gz
          path: MageKit-${{ needs.prepare.outputs.version }}-linux-x64.tar.gz

  # Create GitHub Release
  release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: [prepare, build-macos, build-windows, build-linux]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Download all artifacts
        uses: actions/download-artifact@v7
        with:
          path: artifacts

      - name: List artifacts
        run: |
          echo "Downloaded artifacts:"
          find artifacts -type f -name "*"

      - name: Generate release notes
        id: notes
        shell: bash
        run: |
          set -euo pipefail

          version="${{ needs.prepare.outputs.version }}"
          prev_tag="$(git tag -l 'v[0-9]*' --sort=-version:refname | grep -Fvx "${version}" | head -n 1 || true)"

          {
            echo "## MageKit ${version}"
            echo
            echo "### Downloads"
            echo
            echo "| Platform | File | Description |"
            echo "|----------|------|-------------|"
            echo "| **macOS** | \`MageKit-${version}-macos-universal.dmg\` | DMG installer (Intel + Apple Silicon) |"
            echo "| **macOS** | \`MageKit-${version}-macos-universal.app.zip\` | App bundle zip |"
            echo "| **Windows** | \`MageKit-${version}-windows-x64.exe\` | Standalone executable |"
            echo "| **Windows** | \`MageKit-${version}-windows-x64-portable.zip\` | Portable edition |"
            echo "| **Linux** | \`MageKit-${version}-linux-x64.AppImage\` | AppImage format |"
            echo "| **Linux** | \`MageKit-${version}-linux-x64.tar.gz\` | Binary archive |"
            echo
            echo "### System Requirements"
            echo
            echo "- **macOS**: macOS 11.0 (Big Sur) or later"
            echo "- **Windows**: Windows 10 or later"
            echo "- **Linux**: Vulkan-capable graphics driver required"
            echo
            echo "### Changelog"
            echo
            if [ -n "${prev_tag}" ]; then
              echo "对比：${prev_tag} ... ${version}"
              echo
              git log "${prev_tag}..${GITHUB_SHA}" --no-merges --pretty=format:'- %s (%h)'
            else
              echo "（未找到历史 tag，列出当前提交历史）"
              echo
              git log --no-merges --pretty=format:'- %s (%h)'
            fi
            echo
          } > RELEASE_NOTES.md

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ needs.prepare.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: MageKit ${{ needs.prepare.outputs.version }}
          draft: false
          prerelease: ${{ contains(needs.prepare.outputs.version, 'beta') || contains(needs.prepare.outputs.version, 'alpha') || contains(needs.prepare.outputs.version, 'rc') }}
          generate_release_notes: false
          body_path: RELEASE_NOTES.md
          files: |
            artifacts/macos-dmg/*
            artifacts/macos-app-zip/*
            artifacts/windows-portable-zip/*
            artifacts/windows-exe/*
            artifacts/linux-appimage/*
            artifacts/linux-tar-gz/*

        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
