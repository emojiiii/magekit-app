name: Release

on:
  push:
    branches: [main]

# 同一时间只计算和发布一个版本，避免多个 main 合并争用同一 tag。
concurrency:
  group: magekit-release-main
  cancel-in-progress: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  APP_NAME: MageKit

jobs:
  # Prepare release version
  prepare:
    name: Prepare Release
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      release: ${{ steps.plan.outputs.release }}
      version: ${{ steps.plan.outputs.version }}
      app_version: ${{ steps.plan.outputs.app_version }}
      previous_tag: ${{ steps.plan.outputs.previous_tag }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Plan version and changelog
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/release.py plan

  # macOS build
  build-macos:
    name: Build macOS
    runs-on: macos-latest
    needs: prepare
    if: needs.prepare.outputs.release == 'true'
    env:
      MAGEKIT_RELEASE_VERSION: ${{ needs.prepare.outputs.app_version }}
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-apple-darwin, aarch64-apple-darwin

      - name: Cache cargo
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: macos-release-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            macos-release-cargo-

      - name: Build for x86_64
        run: cargo build --release --target x86_64-apple-darwin

      - name: Build for aarch64 (Apple Silicon)
        run: cargo build --release --target aarch64-apple-darwin

      - name: Create Universal Binary
        run: |
          mkdir -p target/universal-apple-darwin/release
          lipo -create \
            target/x86_64-apple-darwin/release/magekit \
            target/aarch64-apple-darwin/release/magekit \
            -output target/universal-apple-darwin/release/magekit
          chmod +x target/universal-apple-darwin/release/magekit

      - name: Create .app bundle
        run: |
          APP_DIR="MageKit.app"
          mkdir -p "${APP_DIR}/Contents/MacOS"
          mkdir -p "${APP_DIR}/Contents/Resources"

          cp target/universal-apple-darwin/release/magekit "${APP_DIR}/Contents/MacOS/MageKit"
          chmod +x "${APP_DIR}/Contents/MacOS/MageKit"

          if [ -d "themes" ]; then
            mkdir -p "${APP_DIR}/Contents/Resources/themes"
            cp -r themes/* "${APP_DIR}/Contents/Resources/themes/"
          fi

          if [ -f "assets/icon.icns" ]; then
            cp assets/icon.icns "${APP_DIR}/Contents/Resources/AppIcon.icns"
          fi

          cat > "${APP_DIR}/Contents/Info.plist" << 'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleExecutable</key>
              <string>MageKit</string>
              <key>CFBundleIconFile</key>
              <string>AppIcon</string>
              <key>CFBundleIdentifier</key>
              <string>com.emojiiii.magekit</string>
              <key>CFBundleName</key>
              <string>MageKit</string>
              <key>CFBundleDisplayName</key>
              <string>MageKit</string>
              <key>CFBundlePackageType</key>
              <string>APPL</string>
              <key>CFBundleShortVersionString</key>
              <string>${{ needs.prepare.outputs.app_version }}</string>
              <key>CFBundleVersion</key>
              <string>${{ needs.prepare.outputs.app_version }}</string>
              <key>LSMinimumSystemVersion</key>
              <string>11.0</string>
              <key>NSHighResolutionCapable</key>
              <true/>
              <key>NSSupportsAutomaticGraphicsSwitching</key>
              <true/>
          </dict>
          </plist>
          EOF

          # Keep only the .app bundle to reduce runner disk usage before DMG creation
          rm -rf target/x86_64-apple-darwin target/aarch64-apple-darwin target/universal-apple-darwin

      - name: Create DMG
        run: |
          mkdir -p dmg_contents
          cp -r MageKit.app dmg_contents/
          ln -s /Applications dmg_contents/Applications

          # Explicitly reserve size: hdiutil's auto-estimation can be too small and fill up the mounted volume
          CONTENT_KB="$(du -sk dmg_contents | awk '{print $1}')"
          CONTENT_MB="$(( (CONTENT_KB + 1023) / 1024 ))"
          DMG_MB="$(( CONTENT_MB + (CONTENT_MB / 3) + 64 ))"

          hdiutil create -volname "MageKit" \
            -srcfolder dmg_contents \
            -size "${DMG_MB}m" \
            -ov -format UDZO \
            "MageKit-${{ needs.prepare.outputs.version }}-macos-universal.dmg"

      - name: Upload macOS DMG
        uses: actions/upload-artifact@v5
        with:
          name: macos-dmg
          path: MageKit-${{ needs.prepare.outputs.version }}-macos-universal.dmg
          if-no-files-found: error

      - name: Upload macOS App (zip)
        run: |
          zip -r "MageKit-${{ needs.prepare.outputs.version }}-macos-universal.app.zip" MageKit.app

      - name: Upload macOS App zip
        uses: actions/upload-artifact@v5
        with:
          name: macos-app-zip
          path: MageKit-${{ needs.prepare.outputs.version }}-macos-universal.app.zip
          if-no-files-found: error

  # Windows build
  build-windows:
    name: Build Windows
    runs-on: windows-latest
    needs: prepare
    if: needs.prepare.outputs.release == 'true'
    env:
      MAGEKIT_RELEASE_VERSION: ${{ needs.prepare.outputs.app_version }}
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: windows-release-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            windows-release-cargo-

      - name: Build release
        run: cargo build --release

      - name: Prepare release files
        shell: pwsh
        run: |
          $version = "${{ needs.prepare.outputs.version }}"
          $releaseDir = "release-windows"
          
          New-Item -ItemType Directory -Force -Path $releaseDir
          
          Copy-Item "target\release\magekit.exe" "$releaseDir\MageKit.exe"
          
          if (Test-Path "themes") {
            Copy-Item -Recurse "themes" "$releaseDir\themes"
          }
          
          New-Item -ItemType File -Path "$releaseDir\portable.txt" -Value "MageKit Portable Edition"
          
          Compress-Archive -Path "$releaseDir\*" -DestinationPath "MageKit-$version-windows-x64-portable.zip"
          
          Copy-Item "target\release\magekit.exe" "MageKit-$version-windows-x64.exe"

      - name: Upload Windows portable zip
        uses: actions/upload-artifact@v5
        with:
          name: windows-portable-zip
          path: MageKit-${{ needs.prepare.outputs.version }}-windows-x64-portable.zip
          if-no-files-found: error

      - name: Upload Windows exe
        uses: actions/upload-artifact@v5
        with:
          name: windows-exe
          path: MageKit-${{ needs.prepare.outputs.version }}-windows-x64.exe
          if-no-files-found: error

  # Linux build
  build-linux:
    name: Build Linux
    runs-on: ubuntu-22.04
    needs: prepare
    if: needs.prepare.outputs.release == 'true'
    env:
      MAGEKIT_RELEASE_VERSION: ${{ needs.prepare.outputs.app_version }}
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: linux-release-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            linux-release-cargo-

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            pkg-config \
            libssl-dev \
            libxcb1-dev \
            libxcb-render0-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev \
            libxkbcommon-dev \
            libxkbcommon-x11-dev \
            libwayland-dev \
            libvulkan-dev \
            vulkan-tools \
            libegl1-mesa-dev \
            libgles2-mesa-dev \
            libx11-dev \
            libxi-dev \
            libxtst-dev \
            libxrandr-dev \
            libxcursor-dev \
            libxcomposite-dev \
            libxdamage-dev \
            libxfixes-dev \
            libxss-dev \
            libdbus-1-dev \
            libasound2-dev \
            libpulse-dev \
            libatk1.0-dev \
            libgtk-3-dev \
            libgdk-pixbuf2.0-dev \
            libpango1.0-dev \
            libcairo2-dev \
            libfontconfig1-dev \
            libfreetype6-dev \
            fuse \
            libfuse2

      - name: Build release
        run: cargo build --release

      - name: Download AppImage tools
        run: |
          wget -q "https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage" -O appimagetool
          chmod +x appimagetool

      - name: Create AppDir structure
        run: |
          VERSION="${{ needs.prepare.outputs.version }}"
          
          mkdir -p AppDir/usr/bin
          mkdir -p AppDir/usr/share/applications
          mkdir -p AppDir/usr/share/icons/hicolor/256x256/apps
          mkdir -p AppDir/usr/share/magekit
          
          cp target/release/magekit AppDir/usr/bin/magekit
          chmod +x AppDir/usr/bin/magekit
          
          if [ -d "themes" ]; then
            cp -r themes AppDir/usr/share/magekit/
          fi
          
          cat > AppDir/magekit.desktop << EOF
          [Desktop Entry]
          Name=MageKit
          Comment=Video Downloader
          Exec=magekit
          Icon=magekit
          Type=Application
          Categories=AudioVideo;Video;Network;
          Terminal=false
          StartupWMClass=MageKit
          EOF
          
          cp AppDir/magekit.desktop AppDir/usr/share/applications/
          
          if [ -f "assets/icon-256.png" ]; then
            cp assets/icon-256.png AppDir/usr/share/icons/hicolor/256x256/apps/magekit.png
          elif [ -f "assets/icon.png" ]; then
            cp assets/icon.png AppDir/usr/share/icons/hicolor/256x256/apps/magekit.png
          else
            convert -size 256x256 xc:'#4A90D9' \
              -gravity center -pointsize 72 -fill white \
              -annotate 0 "MK" \
              AppDir/usr/share/icons/hicolor/256x256/apps/magekit.png 2>/dev/null || \
            echo "Warning: Could not create placeholder icon"
          fi
          
          ln -sf usr/share/icons/hicolor/256x256/apps/magekit.png AppDir/magekit.png 2>/dev/null || true
          ln -sf usr/share/applications/magekit.desktop AppDir/magekit.desktop
          
          cat > AppDir/AppRun << 'APPRUN'
          #!/bin/bash
          HERE="$(dirname "$(readlink -f "${0}")")"
          export PATH="${HERE}/usr/bin:${PATH}"
          export XDG_DATA_DIRS="${HERE}/usr/share:${XDG_DATA_DIRS:-/usr/local/share:/usr/share}"
          exec "${HERE}/usr/bin/magekit" "$@"
          APPRUN
          chmod +x AppDir/AppRun

      - name: Build AppImage
        run: |
          VERSION="${{ needs.prepare.outputs.version }}"
          ARCH=x86_64 APPIMAGE_EXTRACT_AND_RUN=1 ./appimagetool --no-appstream AppDir "MageKit-${VERSION}-linux-x64.AppImage"

      - name: Create tar.gz archive
        run: |
          VERSION="${{ needs.prepare.outputs.version }}"
          mkdir -p release-linux
          cp target/release/magekit release-linux/
          if [ -d "themes" ]; then
            cp -r themes release-linux/
          fi
          tar -czvf "MageKit-${VERSION}-linux-x64.tar.gz" -C release-linux .

      - name: Upload Linux AppImage
        uses: actions/upload-artifact@v5
        with:
          name: linux-appimage
          path: MageKit-${{ needs.prepare.outputs.version }}-linux-x64.AppImage
          if-no-files-found: error

      - name: Upload Linux tar.gz
        uses: actions/upload-artifact@v5
        with:
          name: linux-tar-gz
          path: MageKit-${{ needs.prepare.outputs.version }}-linux-x64.tar.gz
          if-no-files-found: error

  # Create GitHub Release
  release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: [prepare, build-macos, build-windows, build-linux]
    if: needs.prepare.outputs.release == 'true'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Download all artifacts
        uses: actions/download-artifact@v5
        with:
          path: artifacts

      - name: Verify release assets
        env:
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          for file in \
            "artifacts/macos-dmg/MageKit-${RELEASE_VERSION}-macos-universal.dmg" \
            "artifacts/macos-app-zip/MageKit-${RELEASE_VERSION}-macos-universal.app.zip" \
            "artifacts/windows-portable-zip/MageKit-${RELEASE_VERSION}-windows-x64-portable.zip" \
            "artifacts/windows-exe/MageKit-${RELEASE_VERSION}-windows-x64.exe" \
            "artifacts/linux-appimage/MageKit-${RELEASE_VERSION}-linux-x64.AppImage" \
            "artifacts/linux-tar-gz/MageKit-${RELEASE_VERSION}-linux-x64.tar.gz"; do
            test -s "$file" || { echo "Missing or empty release asset: $file" >&2; exit 1; }
          done

      - name: Generate release notes
        env:
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
          PREVIOUS_TAG: ${{ needs.prepare.outputs.previous_tag }}
        run: python3 scripts/release.py notes --version "$RELEASE_VERSION" --previous-tag "$PREVIOUS_TAG"

      - name: Check release tag target
        env:
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          git fetch --tags origin
          tag_commit="$(git rev-parse -q --verify "refs/tags/${RELEASE_VERSION}^{commit}" || true)"
          if [ -n "$tag_commit" ] && [ "$tag_commit" != "$GITHUB_SHA" ]; then
            echo "Release tag ${RELEASE_VERSION} points to $tag_commit, expected $GITHUB_SHA" >&2
            exit 1
          fi

      - name: Confirm main still points to this build
        id: current
        run: |
          set -euo pipefail
          main_commit="$(git ls-remote origin refs/heads/main | cut -f1)"
          test -n "$main_commit"
          if [ "$main_commit" = "$GITHUB_SHA" ]; then
            echo 'publish=true' >> "$GITHUB_OUTPUT"
          else
            echo "main advanced to $main_commit; the newer run will publish all pending changes"
            echo 'publish=false' >> "$GITHUB_OUTPUT"
          fi

      - name: Create Release
        if: steps.current.outputs.publish == 'true'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.prepare.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: MageKit ${{ needs.prepare.outputs.version }}
          prerelease: false
          generate_release_notes: false
          fail_on_unmatched_files: true
          body_path: RELEASE_NOTES.md
          files: |
            artifacts/macos-dmg/*
            artifacts/macos-app-zip/*
            artifacts/windows-portable-zip/*
            artifacts/windows-exe/*
            artifacts/linux-appimage/*
            artifacts/linux-tar-gz/*
            MageKit-${{ needs.prepare.outputs.version }}-CHANGELOG.md
