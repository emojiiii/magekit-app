name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # Format check
  fmt:
    name: Format Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Prepare formatting fix for local application
        if: failure()
        run: |
          cargo fmt --all
          git diff --binary > rustfmt.patch
          python3 - <<'PYCODE'
          import subprocess, tarfile
          paths = subprocess.check_output(["git", "diff", "--name-only", "-z"]).decode().split("\0")
          with tarfile.open("rustfmt-files.tar.gz", "w:gz") as archive:
              for path in filter(None, paths):
                  archive.add(path, arcname=path)
          PYCODE
      - name: Upload formatting fix (no repository writes)
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: rustfmt-fix
          path: |
            rustfmt.patch
            rustfmt-files.tar.gz
          retention-days: 3
