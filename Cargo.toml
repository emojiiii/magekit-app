[workspace]
members = [
    ".",
    "crates/download",
    "crates/shared",
    "crates/tool_manager",
    "crates/live_recorder",
    "crates/xbogus",
    "crates/extractor",
    "crates/platform_api",
    "crates/capture",
]
resolver = "2"
[workspace.package]
version = "0.1.0"
edition = "2024"
authors = ["emojiiii"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/emojiiii/magekit-app"

[workspace.dependencies]
# Core dependencies
anyhow = "1.0"
thiserror = "2.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.0", features = ["full"] }
uuid = { version = "1.0", features = ["v4", "serde"] }
reqwest = { version = "0.11", features = ["json"] }
url = "2.4"

# GPUI dependencies
gpui = { version = "*" }
gpui-component = { version = "*" }
gpui-component-assets = { version = "*" }
reqwest_client = { git = "https://github.com/longbridge/gpui-component.git", tag = "v0.5.0" }

# Configuration
toml = "0.9"
dirs = "5.0"

# Logging
tracing = "0.1"
tracing-subscriber = "0.3"

# Time handling
chrono = { version = "0.4", features = ["serde"] }

[package]
name = "magekit-app"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "magekit"
path = "src/main.rs"

[dependencies]
# 内部依赖
magekit-shared = { path = "crates/shared" }
magekit-tool-manager = { path = "crates/tool_manager" }
magekit-capture = { path = "crates/capture" }
live_recorder = { path = "crates/live_recorder" }

# GPUI dependencies
gpui = { workspace = true }
gpui-component = { workspace = true }
gpui-component-assets = { workspace = true }
gpui-router = "0.2.7"

# 异步运行时
tokio = { workspace = true }
smol = "2"

# 错误处理
anyhow = { workspace = true }
thiserror = { workspace = true }

# 序列化
serde = { workspace = true }
serde_json = { workspace = true }

# 配置
toml = { workspace = true }
dirs = { workspace = true }

# 日志
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

# UUID
uuid = { workspace = true }

# 时间处理
chrono = { workspace = true }

# 随机数
rand = "0.8"

# 同步原语
parking_lot = "0.12"

# 工具检测
which = "7"

# 文件对话框
rfd = "0.15"

# HTTP 客户端（用于加载远程图片）
reqwest_client = { workspace = true }

# HTTP 直链下载
reqwest = { workspace = true, features = ["blocking"] }
url = { workspace = true }
urlencoding = "2.1"

# 临时文件（用于 Cookie）
tempfile = "3"
open = "5.3.3"
tokio-tungstenite = { version = "0.21", features = ["rustls-tls-webpki-roots"] }
futures-util = "0.3"

[profile.dev]
codegen-units = 16
debug = "limited"
split-debuginfo = "unpacked"

[profile.dev.package]
resvg = { opt-level = 3 }
rustybuzz = { opt-level = 3 }
taffy = { opt-level = 3 }
ttf-parser = { opt-level = 3 }
