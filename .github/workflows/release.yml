name: Release

on:
  push:
    tags:
      - "v*"

env:
  CARGO_TERM_COLOR: always
  APP_NAME: MageKit

jobs:
  # 创建 Release
  create-release:
    name: Create Release
    runs-on: ubuntu-latest
    outputs:
      upload_url: ${{ steps.create_release.outputs.upload_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Create Release
        id: create_release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref_name }}
          release_name: MageKit ${{ github.ref_name }}
          draft: false
          prerelease: ${{ contains(github.ref_name, 'beta') || contains(github.ref_name, 'alpha') }}
          body: |
            ## 🎉 MageKit ${{ github.ref_name }}

            ### 📥 下载
            - **macOS (Universal)**: `MageKit-${{ github.ref_name }}-macos-universal.dmg`
            - **Windows**: `MageKit-${{ github.ref_name }}-windows-x64.exe`
            - **Linux**: `MageKit-${{ github.ref_name }}-linux-x64.AppImage`

            ### 📋 更新日志
            请查看 [CHANGELOG.md](CHANGELOG.md)

  # macOS 构建和打包
  build-macos:
    name: Build macOS
    runs-on: macos-latest
    needs: create-release
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-action@stable
        with:
          targets: x86_64-apple-darwin, aarch64-apple-darwin

      - name: Build for x86_64
        run: cargo build --release --target x86_64-apple-darwin

      - name: Build for aarch64
        run: cargo build --release --target aarch64-apple-darwin

      - name: Create Universal Binary
        run: |
          mkdir -p target/universal-apple-darwin/release
          lipo -create \
            target/x86_64-apple-darwin/release/magekit \
            target/aarch64-apple-darwin/release/magekit \
            -output target/universal-apple-darwin/release/magekit

      - name: Create .app bundle
        run: |
          mkdir -p "MageKit.app/Contents/MacOS"
          mkdir -p "MageKit.app/Contents/Resources"
          cp target/universal-apple-darwin/release/magekit "MageKit.app/Contents/MacOS/MageKit"
          cp assets/Info.plist "MageKit.app/Contents/" 2>/dev/null || echo "No Info.plist"
          cp assets/icon.icns "MageKit.app/Contents/Resources/" 2>/dev/null || echo "No icon"
          chmod +x "MageKit.app/Contents/MacOS/MageKit"

      - name: Create DMG
        run: |
          hdiutil create -volname "MageKit" -srcfolder "MageKit.app" -ov -format UDZO "MageKit-${{ github.ref_name }}-macos-universal.dmg"

      - name: Upload macOS DMG
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ needs.create-release.outputs.upload_url }}
          asset_path: MageKit-${{ github.ref_name }}-macos-universal.dmg
          asset_name: MageKit-${{ github.ref_name }}-macos-universal.dmg
          asset_content_type: application/octet-stream

  # Windows 构建和打包
  build-windows:
    name: Build Windows
    runs-on: windows-latest
    needs: create-release
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-action@stable

      - name: Build release
        run: cargo build --release

      - name: Rename executable
        run: |
          copy target\release\magekit.exe MageKit-${{ github.ref_name }}-windows-x64.exe

      - name: Upload Windows exe
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ needs.create-release.outputs.upload_url }}
          asset_path: MageKit-${{ github.ref_name }}-windows-x64.exe
          asset_name: MageKit-${{ github.ref_name }}-windows-x64.exe
          asset_content_type: application/octet-stream

  # Linux 构建和打包
  build-linux:
    name: Build Linux
    runs-on: ubuntu-latest
    needs: create-release
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-action@stable

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libssl-dev pkg-config libxcb1-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev

      - name: Build release
        run: cargo build --release

      - name: Install AppImage tools
        run: |
          wget -q https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool-x86_64.AppImage

      - name: Create AppDir structure
        run: |
          mkdir -p AppDir/usr/bin
          mkdir -p AppDir/usr/share/applications
          mkdir -p AppDir/usr/share/icons/hicolor/256x256/apps
          cp target/release/magekit AppDir/usr/bin/magekit
          chmod +x AppDir/usr/bin/magekit
          cat > AppDir/magekit.desktop << EOF
          [Desktop Entry]
          Name=MageKit
          Exec=magekit
          Icon=magekit
          Type=Application
          Categories=Utility;AudioVideo;
          EOF
          cp AppDir/magekit.desktop AppDir/usr/share/applications/
          # 创建简单图标（如果没有真实图标）
          convert -size 256x256 xc:blue AppDir/usr/share/icons/hicolor/256x256/apps/magekit.png 2>/dev/null || echo "No icon created"
          ln -sf usr/share/applications/magekit.desktop AppDir/magekit.desktop
          cat > AppDir/AppRun << 'EOF'
          #!/bin/bash
          HERE="$(dirname "$(readlink -f "${0}")")"
          exec "${HERE}/usr/bin/magekit" "$@"
          EOF
          chmod +x AppDir/AppRun

      - name: Build AppImage
        run: |
          ARCH=x86_64 ./appimagetool-x86_64.AppImage AppDir MageKit-${{ github.ref_name }}-linux-x64.AppImage || \
          cp target/release/magekit MageKit-${{ github.ref_name }}-linux-x64

      - name: Upload Linux AppImage
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ needs.create-release.outputs.upload_url }}
          asset_path: MageKit-${{ github.ref_name }}-linux-x64.AppImage
          asset_name: MageKit-${{ github.ref_name }}-linux-x64.AppImage
          asset_content_type: application/octet-stream
