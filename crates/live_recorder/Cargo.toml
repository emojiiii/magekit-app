[package]
name = "live_recorder"
version.workspace = true
edition.workspace = true

[dependencies]
# Core dependencies from workspace
anyhow = { workspace = true }
thiserror = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
uuid = { workspace = true }
# reqwest with compression support
reqwest = { version = "0.12", features = ["json", "gzip", "deflate", "brotli"] }
url = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
# Shared utilities
magekit-shared = { path = "../shared" }

# Additional dependencies for live recording
async-trait = "0.1"
bytes = "1.0"
futures = "0.3"
hex = "0.4"
md-5 = "0.10"
base64 = "0.22"
rand = "0.8"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.0", features = ["derive"] }
urlencoding = "2.1"
regex = "1"

# Local dependencies
xbogus = { path = "../xbogus" }
platform-api = { path = "../platform_api" }
