name: One-off Streamlink branch repair
on:
  push:
    branches: [feat/streamlink-uv-recording]
    paths: [.github/workflows/streamlink-branch-repair.yml]
permissions:
  contents: write
jobs:
  repair:
    if: github.repository == 'emojiiii/magekit-app' && github.actor == 'emojiiii' && github.ref == 'refs/heads/feat/streamlink-uv-recording'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feat/streamlink-uv-recording
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Refresh workspace lock without a general dependency upgrade
        run: cargo update --workspace
      - name: Apply official formatting
        run: cargo fmt --all
      - name: Commit only the allowlisted files to the feature branch
        run: |
          git add Cargo.lock crates/live_recorder/build.rs crates/live_recorder/src/main.rs crates/live_recorder/src/recorder.rs crates/live_recorder/src/streamlink_runtime.rs src/ui/pages/tools/streamlink_page.rs
          git diff --cached --stat
          if git diff --cached --quiet; then exit 0; fi
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'fix: synchronize workspace lockfile and apply rustfmt'
          git push origin HEAD:refs/heads/feat/streamlink-uv-recording
